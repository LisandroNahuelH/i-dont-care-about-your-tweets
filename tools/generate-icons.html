<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator - I Don't Care About Your Tweets</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6e6e6;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    h1 { color: #58a6ff; }
    .icons-grid {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: end;
    }
    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: #161b22;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #30363d;
    }
    canvas {
      border: 1px solid #30363d;
      border-radius: 4px;
    }
    label { font-size: 14px; color: #8b949e; }
    a {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 16px;
      background: #1DA1F2;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
    }
    a:hover { background: #1a8cd8; }
    .instructions {
      max-width: 600px;
      background: #161b22;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #30363d;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>🎨 Icon Generator</h1>
  <p>Click each download button to save the icon at that size.</p>
  
  <div class="icons-grid" id="grid"></div>

  <div class="instructions">
    <h3>📂 Instructions</h3>
    <p>1. Click each "Download" button below each icon.<br>
       2. Save each file to your extension's <code>icons/</code> folder with the exact filename shown.<br>
       3. The manifest.json has already been updated to reference these icons.</p>
  </div>

  <script>
    const SIZES = [16, 32, 48, 128];
    const grid = document.getElementById('grid');

    function drawIcon(ctx, size) {
      const s = size / 128; // scale factor

      // Background rounded rect
      const r = 24 * s;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();

      const bgGrad = ctx.createLinearGradient(0, 0, size, size);
      bgGrad.addColorStop(0, '#1a1a2e');
      bgGrad.addColorStop(1, '#16213e');
      ctx.fillStyle = bgGrad;
      ctx.fill();

      // Speech bubble
      ctx.beginPath();
      ctx.moveTo(30*s, 38*s);
      ctx.bezierCurveTo(30*s, 30*s, 38*s, 24*s, 48*s, 24*s);
      ctx.lineTo(80*s, 24*s);
      ctx.bezierCurveTo(90*s, 24*s, 98*s, 30*s, 98*s, 38*s);
      ctx.lineTo(98*s, 68*s);
      ctx.bezierCurveTo(98*s, 76*s, 90*s, 82*s, 80*s, 82*s);
      ctx.lineTo(58*s, 82*s);
      ctx.lineTo(42*s, 98*s);
      ctx.lineTo(46*s, 82*s);
      ctx.lineTo(48*s, 82*s);
      ctx.bezierCurveTo(38*s, 82*s, 30*s, 76*s, 30*s, 68*s);
      ctx.closePath();

      const bubbleGrad = ctx.createLinearGradient(30*s, 24*s, 98*s, 98*s);
      bubbleGrad.addColorStop(0, '#1DA1F2');
      bubbleGrad.addColorStop(1, '#4ECDC4');
      ctx.fillStyle = bubbleGrad;
      ctx.globalAlpha = 0.9;
      ctx.fill();
      ctx.globalAlpha = 1.0;

      // X mark inside bubble
      const cx = 64 * s;
      const cy = 53 * s;
      const xSize = 14 * s;
      const xWidth = Math.max(6 * s, 1.5);

      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth = xWidth;
      ctx.lineCap = 'round';
      
      ctx.beginPath();
      ctx.moveTo(cx - xSize, cy - xSize);
      ctx.lineTo(cx + xSize, cy + xSize);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + xSize, cy - xSize);
      ctx.lineTo(cx - xSize, cy + xSize);
      ctx.stroke();

      // Diagonal slash through everything
      const slashGrad = ctx.createLinearGradient(26*s, 96*s, 102*s, 20*s);
      slashGrad.addColorStop(0, '#FF6B6B');
      slashGrad.addColorStop(1, '#FF8E53');
      ctx.strokeStyle = slashGrad;
      ctx.lineWidth = Math.max(8 * s, 2);
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(26*s, 96*s);
      ctx.lineTo(102*s, 20*s);
      ctx.stroke();
    }

    SIZES.forEach(size => {
      const card = document.createElement('div');
      card.className = 'icon-card';

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      // Display at a visible size for small icons
      const displaySize = Math.max(size, 64);
      canvas.style.width = displaySize + 'px';
      canvas.style.height = displaySize + 'px';
      canvas.style.imageRendering = size < 64 ? 'pixelated' : 'auto';

      const ctx = canvas.getContext('2d');
      drawIcon(ctx, size);

      const label = document.createElement('label');
      label.textContent = `icon${size}.png (${size}×${size})`;

      const link = document.createElement('a');
      link.textContent = `⬇ Download icon${size}.png`;
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');

      card.appendChild(canvas);
      card.appendChild(label);
      card.appendChild(link);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
